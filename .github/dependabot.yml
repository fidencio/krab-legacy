version: 2
updates:
  - package-ecosystem: cargo
    directories: [/core, /cli, /preflight, /fuzz]
    schedule:
      interval: daily
    cooldown:
      default-days: 7
    groups:
      rust-dependencies:
        patterns: ['*']
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      npm-dependencies:
        patterns: ['*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
